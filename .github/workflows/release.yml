name: Auto Release on Push

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create latest pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: "master"
          name: "Release"
          body: "Pre-release updated on the latest push to main."
          preRelease: true
          allowUpdates: true
          removeArtifacts: true
          makeLatest: false
